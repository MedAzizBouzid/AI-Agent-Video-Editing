[project]
name = "videoagent"
version = "0.1.0"
description = "AI video production agent: hosted LLM brain, local Whisper + FFmpeg"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "typer>=0.12",
    "faster-whisper>=1.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "rq>=1.16", "redis>=5.0"]
obs = ["langfuse>=2.0"]
# Pick the TTS backends you route to in configs/tts.yaml (see the notes there on languages and terms).
tts = ["piper-tts>=1.2", "kokoro>=0.9", "soundfile>=0.12", "edge-tts>=6.1"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
videoagent = "apps.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
