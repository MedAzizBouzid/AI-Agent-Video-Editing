[project]
name = "videoagent"
version = "0.1.0"
description = "AI video production agent: hosted LLM brain, local Whisper + FFmpeg"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "typer>=0.12",
    "faster-whisper>=1.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "rq>=1.16", "redis>=5.0"]
obs = ["langfuse>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
videoagent = "apps.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
